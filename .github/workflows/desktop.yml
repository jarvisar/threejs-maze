# The desktop app (desktop/): the game's web build in Electron, for Windows, Linux (Steam Deck) and macOS.
#
# - Every push and pull request that changes the game or desktop/, and "Run workflow": builds for all three,
#   after the source smoke test on Linux. Builds are downloadable from the run's
#   Artifacts for two weeks. Each build is started and checked by the same smoke test before it's uploaded.
# - A version tag (npm version patch && git push --follow-tags): the same, published as a GitHub Release. The tag
#   has to match the version in package.json. Publishing the release is what makes installed copies update (see
#   desktop/updates.js), so the latest*.yml files go up with the builds.
#
# The web build goes out through deploy.yml as before; nothing here touches GitHub Pages.
name: Desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'desktop/**'
      - 'tests/desktop.test.js'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'desktop/**'
      - 'tests/desktop.test.js'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older build pointless. Tags always finish.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version). Bump the version (npm version) before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm test -- --maxWorkers=2
      - run: npm run build

      # Ubuntu 24.04 keeps unprivileged user namespaces from programs without an AppArmor profile, which leaves
      # Chromium's sandbox with nothing to use. Installed packages bring their own profile; this is just for CI.
      - name: Prepare the Linux desktop
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox wmctrl

      - name: Smoke test
        run: xvfb-run --auto-servernum bash desktop/scripts/test-linux.sh

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-report
          path: |
            desktop/playwright-report
            desktop/test-results
            ${{ runner.temp }}/backrooms-openbox.log
          retention-days: 14

  package:
    needs: smoke
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            target: win
            app: desktop/release/win-unpacked/Backrooms Simulator.exe
          - os: ubuntu-latest
            name: linux
            target: linux
            app: desktop/release/linux-unpacked/backrooms-simulator
          - os: macos-latest
            name: macos
            target: mac
            app: desktop/release/mac-universal/Backrooms Simulator.app/Contents/MacOS/Backrooms Simulator
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build
      - run: npm --prefix desktop test

      - name: Build
        # The Node wrapper never publishes and verifies all outputs before returning success.
        run: npm --prefix desktop run dist:${{ matrix.target }}
        env:
          # Signs and notarizes the Mac build when these secrets exist (see desktop/README.md); without them it's
          # signed ad hoc. Only on the Mac: electron-builder would try the same certificate on Windows.
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}

      - name: Prepare the Linux desktop
        if: matrix.name == 'linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox wmctrl

      # Every platform must pass before its builds can be uploaded or included in a release.
      - name: Smoke test the build
        shell: bash
        env:
          BACKROOMS_APP: ${{ github.workspace }}/${{ matrix.app }}
        run: |
          node -e "require('node:fs').accessSync(process.env.BACKROOMS_APP)"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum bash desktop/scripts/test-linux.sh
          else
            npx playwright test -c desktop
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: backrooms-simulator-${{ matrix.name }}
          # latest*.yml and the .blockmap files are for updates: the installed game reads the .yml to find a new
          # version, and the blockmaps let it download only what changed.
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-report-${{ matrix.name }}
          path: |
            desktop/playwright-report
            desktop/test-results
            desktop/release/builder-debug.yml
            desktop/release/builder-effective-config.yaml
            ${{ runner.temp }}/backrooms-openbox.log
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: backrooms-simulator-*
          path: release
          merge-multiple: true

      - name: Check the update files are there
        run: |
          for file in latest.yml latest-linux.yml latest-mac.yml; do
            if [ ! -f "release/$file" ]; then
              echo "::error::release/$file is missing: installed copies of the game wouldn't see this version."
              exit 1
            fi
          done

      # Made as a draft first so every file, the latest*.yml ones included, is up before anyone can see it, then
      # published. Publishing is what sends the update to installed copies: electron-updater ignores drafts.
      # Running the workflow again for the same tag finishes a draft left by a failed run, but must never change a
      # published release.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::This release is already published. Use a new version instead of replacing a live update."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --title "Backrooms Simulator ${GITHUB_REF_NAME#v}"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
