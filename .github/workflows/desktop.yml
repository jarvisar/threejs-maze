# The desktop app (desktop/): the game's web build in Electron, for Windows, Linux (Steam Deck) and macOS.
#
# - Every push and pull request that changes the game or desktop/: the smoke test, on Linux.
# - Pushes to main, and "Run workflow" on the Actions tab: builds for all three, downloadable from the run's
#   Artifacts for two weeks. Each build is started and checked by the same smoke test before it's uploaded.
# - A version tag (git tag v2.1.0 && git push origin v2.1.0): the same, attached to a draft GitHub Release to look
#   over and publish. The tag has to match the version in package.json.
#
# The web build goes out through deploy.yml as before; nothing here touches GitHub Pages.
name: Desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'desktop/**'
      - 'tests/desktop.test.js'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'desktop/**'
      - 'tests/desktop.test.js'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older build pointless. Tags always finish.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version). Bump the version (npm version) before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm test
      - run: npm run build

      # Ubuntu 24.04 keeps unprivileged user namespaces from programs without an AppArmor profile, which leaves
      # Chromium's sandbox with nothing to use. Installed packages bring their own profile; this is just for CI.
      - name: Let Electron's sandbox run
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test
        run: xvfb-run --auto-servernum npx playwright test -c desktop

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-report
          path: desktop/playwright-report
          retention-days: 14

  package:
    if: github.event_name != 'pull_request'
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            app: desktop/release/win-unpacked/Backrooms Simulator.exe
          - os: ubuntu-latest
            name: linux
            app: desktop/release/linux-unpacked/backrooms-simulator
          - os: macos-latest
            name: macos
            app: desktop/release/mac-universal/Backrooms Simulator.app/Contents/MacOS/Backrooms Simulator
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build

      - name: Build
        run: npm --prefix desktop run dist -- --publish never
        env:
          # Signs and notarizes the Mac build when these secrets exist (see desktop/README.md); without them it's
          # signed ad hoc. Only on the Mac: electron-builder would try the same certificate on Windows.
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}

      - name: Let Electron's sandbox run
        if: matrix.name == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The packaged app, as a player would start it. Nobody here has a Mac to try it on, so this is the Mac
      # build's only check; macOS runners are virtual machines, so a failure there is reported but doesn't stop
      # the build from being uploaded.
      - name: Smoke test the build
        continue-on-error: ${{ matrix.name == 'macos' }}
        shell: bash
        env:
          BACKROOMS_APP: ${{ github.workspace }}/${{ matrix.app }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum npx playwright test -c desktop
          else
            npx playwright test -c desktop
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: backrooms-simulator-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-report-${{ matrix.name }}
          path: desktop/playwright-report
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: backrooms-simulator-*
          path: release
          merge-multiple: true

      # A draft, so nothing is public until it's been looked over and published by hand. Running the workflow
      # again for the same tag replaces the files.
      - name: Draft a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --title "Backrooms Simulator ${GITHUB_REF_NAME#v}"
          fi
